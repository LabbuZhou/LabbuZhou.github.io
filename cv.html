<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="assets/couple-logo.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/couple-logo.png">
  <meta name="theme-color" content="#11151e">
  <title>CV | Shirui Zhou</title>
  <link rel="canonical" href="https://labbuzhou.github.io/cv.html">
  <meta name="description" content="Curriculum vitae of Shirui Zhou.">
  <style>
    :root { --ink:#e9edf5; --muted:#9ca7ba; --paper:#11151e; --panel:#181e2a; --line:#2d374b; --lime:#c9f36b; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    .page { max-width:1440px; min-height:100vh; margin:auto; padding:0 34px; }
    .topbar { min-height:78px; display:flex; align-items:center; justify-content:space-between; gap:24px; border-bottom:1px solid var(--line); }
    .topbar a { color:var(--muted); font-size:16px; font-weight:650; text-decoration:none; }
    .topbar a:hover, .topbar a:focus-visible { color:var(--ink); }
    .download { flex:0 0 auto; color:var(--paper)!important; background:var(--lime); border-radius:999px; padding:10px 15px; }
    .download:hover, .download:focus-visible { color:var(--paper)!important; filter:brightness(.95); }
    .heading { padding:64px 0 28px; }
    .eyebrow { margin:0 0 11px; color:var(--lime); font-size:12px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
    h1 { margin:0; font:clamp(42px,6vw,74px)/.96 Georgia,"Times New Roman",serif; letter-spacing:-.06em; }
    .heading p { max-width:570px; margin:18px 0 0; color:var(--muted); line-height:1.7; }
    .viewer { height:min(79vh,1080px); min-height:680px; margin-bottom:52px; border:1px solid var(--line); background:#252525; }
    iframe { display:block; width:100%; height:100%; border:0; }
    @media (max-width:760px) {
      .page { padding:0 18px; }
      .topbar { min-height:66px; gap:12px; }
      .topbar a { font-size:14px; }
      .download { padding:9px 12px; }
      .heading { padding:44px 0 24px; }
      .viewer { height:74vh; min-height:560px; margin-bottom:28px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a href="index.html">← Home</a>
      <a class="download" href="cv.pdf" download>Download PDF ↓</a>
    </header>
    <main>
      <section class="heading">
        <p class="eyebrow">Shirui Zhou</p>
        <h1>Curriculum Vitae</h1>
        <p>View the current CV in the browser or download the PDF.</p>
      </section>
      <section class="viewer" aria-label="Curriculum vitae PDF viewer">
        <iframe src="cv.pdf#view=FitH" title="Shirui Zhou curriculum vitae">
          <p>Your browser cannot display the PDF. <a href="cv.pdf" download>Download the CV (PDF).</a></p>
        </iframe>
      </section>
    </main>
  </div>
</body>
</html>
